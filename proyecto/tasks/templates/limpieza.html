<script>
  // Normaliza texto: quita tildes, mayúsculas, espacios extra
  function normalizarTexto(texto) {
    return (texto || '')
      .toString()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase();
  }

  // Modifica buscarServicios para comparar regiones y comunas normalizadas
  function buscarServicios() {
    const input = normalizarTexto(document.getElementById('searchInput').value);
    const region = normalizarTexto(document.getElementById('regionFiltro').value);
    const comuna = normalizarTexto(document.getElementById('comunaFiltro').value);
    const filtrados = serviciosData.filter(data => {
      const servicio = normalizarTexto(data.servicio);
      const nombre = normalizarTexto(data.nombre);
      const descripcion = normalizarTexto(data.descripcion);
      const dataComuna = normalizarTexto(data.comuna);
      // Cambia aquí: si en Firestore guardaste solo el nombre corto de la región (ej: "Atacama"), extrae el nombre corto del filtro
      let dataRegion = normalizarTexto(data.region);

      // Extrae el nombre corto de la región seleccionada para comparar
      let regionFiltroCorto = region.replace(/^region( del| de| metropolitana| metropolitano)? /, '').replace(/^(libertador general bernardo o'higgins|aysen del general carlos ibanez del campo|magallanes y de la antartica chilena)/, '').trim();

      // También extrae el nombre corto de la región del dato
      let dataRegionCorto = dataRegion.replace(/^region( del| de| metropolitana| metropolitano)? /, '').replace(/^(libertador general bernardo o'higgins|aysen del general carlos ibanez del campo|magallanes y de la antartica chilena)/, '').trim();

      const coincideBusqueda =
        servicio.includes(input) ||
        nombre.includes(input) ||
        descripcion.includes(input) ||
        dataComuna.includes(input) ||
        dataRegion.includes(input);

      // Compara por nombre corto si no coincide por nombre largo
      const coincideRegion = !region || dataRegion === region || dataRegionCorto === regionFiltroCorto;
      const coincideComuna = !comuna || dataComuna === comuna;
      return coincideBusqueda && coincideRegion && coincideComuna;
    });
    renderServicios(filtrados);
  }
</script>

  };
  // Inicializa Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let serviciosData = [];

  // Renderiza las tarjetas de servicios
  function renderServicios(servicios) {
    const row = document.querySelector('.row');
    row.innerHTML = '';
    if (servicios.length === 0) {
      row.innerHTML = '<div class="col-12 text-center text-muted">No hay servicios disponibles.</div>';
      return;
    }
    servicios.forEach(data => {
      const card = document.createElement('div');
      card.className = 'col-md-4 mb-4';
      card.innerHTML = `
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">${data.servicio || ''}</h5>
            <ul class="list-unstyled mb-2">
              <li><strong>Nombre:</strong> ${data.nombre || ''}</li>
              <li><strong>Descripción:</strong> ${data.descripcion || ''}</li>
              <li><strong>Comuna:</strong> ${data.comuna || ''}</li>
              <li><strong>Región:</strong> ${data.region || ''}</li>
            </ul>
            <div class="border border-success rounded p-2 mb-3 text-success fw-bold">Precio: $${data.precio || ''}</div>
            <a href="#" class="btn btn-primary">Solicitar</a>
          </div>
        </div>
      `;
      row.appendChild(card);
    });
  }

  // Cargar servicios desde Firestore
  function cargarServicios() {
    db.collection('servicios').get().then((querySnapshot) => {
      serviciosData = [];
      querySnapshot.forEach((doc) => {
        serviciosData.push(doc.data());
      });
      buscarServicios(); // Mostrar servicios filtrados según los selectores actuales
    });
  }

  function ordenarServicios(direccion) {
    // Aplica los filtros actuales antes de ordenar
    const input = normalizarTexto(document.getElementById('searchInput').value);
    const region = normalizarTexto(document.getElementById('regionFiltro').value);
    const comuna = normalizarTexto(document.getElementById('comunaFiltro').value);
    const filtrados = serviciosData.filter(data => {
      const servicio = normalizarTexto(data.servicio);
      const nombre = normalizarTexto(data.nombre);
      const descripcion = normalizarTexto(data.descripcion);
      const dataComuna = normalizarTexto(data.comuna);
      let dataRegion = normalizarTexto(data.region);

      let regionFiltroCorto = region.replace(/^region( del| de| metropolitana| metropolitano)? /, '').replace(/^(libertador general bernardo o'higgins|aysen del general carlos ibanez del campo|magallanes y de la antartica chilena)/, '').trim();
      let dataRegionCorto = dataRegion.replace(/^region( del| de| metropolitana| metropolitano)? /, '').replace(/^(libertador general bernardo o'higgins|aysen del general carlos ibanez del campo|magallanes y de la antartica chilena)/, '').trim();

      const coincideBusqueda =
        servicio.includes(input) ||
        nombre.includes(input) ||
        descripcion.includes(input) ||
        dataComuna.includes(input) ||
        dataRegion.includes(input);

      const coincideRegion = !region || dataRegion === region || dataRegionCorto === regionFiltroCorto;
      const coincideComuna = !comuna || dataComuna === comuna;
      return coincideBusqueda && coincideRegion && coincideComuna;
    });

    let copia = [...filtrados];
    copia.sort((a, b) => {
      const precioA = Number(a.precio) || 0;
      const precioB = Number(b.precio) || 0;
      return direccion === 'asc' ? precioA - precioB : precioB - precioA;
    });
    renderServicios(copia);
  }

  document.getElementById('searchInput').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') buscarServicios();
  });

  // Cargar servicios al iniciar
  window.addEventListener('DOMContentLoaded', cargarServicios);
</script>
