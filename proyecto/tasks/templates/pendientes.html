<!DOCTYPE html>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reservas Pendientes</title>
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="d-flex flex-column align-items-center">
        <h1 class="mb-4">Reservas Pendientes</h1>
        <div id="reservas-list" class="reserva-grid"></div>
    </div>
    <style>
        .reserva-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        @media (min-width: 1200px) {
            .reserva-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        .reserva-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            width: 100%;
            min-width: 0;
        }
        .reserva-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
    <script>
        // Configura tu Firebase aquí
        const firebaseConfig = {
            apiKey: "AIzaSyAwjwOh4bjRM3ZtRyV-bGssJ5TCEcRR69c",
            authDomain: "registrousuario-49a1c.firebaseapp.com",
            projectId: "registrousuario-49a1c",
            storageBucket: "registrousuario-49a1c.appspot.com",
            messagingSenderId: "459096702108",
            appId: "1:459096702108:web:7874c1194fb30836ba0159",
            measurementId: "G-FP2WT4DCLJ"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        // Obtiene la lista de reservas pendientes
        const reservasList = document.getElementById('reservas-list');

        function actualizarEstadoReserva(reservaId, nuevoEstado) {
            db.collection('reservas').doc(reservaId).update({
                estado: nuevoEstado
            }).then(() => {
                // Elimina la tarjeta de la reserva actualizada
                const card = document.getElementById('reserva-' + reservaId);
                if (card) card.remove();
            }).catch((error) => {
                alert('Error actualizando estado: ' + error.message);
            });
        }

        // Renderiza cada reserva como tarjeta
        function renderReservaCard(doc) {
            const data = doc.data();
            const direccion = [data.comuna, data.region].filter(Boolean).join(', ');
            const precio = data.precio !== undefined ? `$${data.precio}` : '-';
            const card = document.createElement('div');
            card.className = 'reserva-card';
            card.id = 'reserva-' + doc.id;
            card.innerHTML = `
                <h5>${data.servicio || 'Servicio'}</h5>
                <p><strong>Fecha:</strong> ${data.fecha || '-'}</p>
                <p><strong>Cliente:</strong> ${data.nombreUsuario || '-'}</p>
                <p><strong>Dirección:</strong> ${direccion || '-'}</p>
                <p><strong>Precio:</strong> ${precio}</p>
                <div class="reserva-btns">
                    <button class="btn btn-success btn-sm" onclick="actualizarEstadoReserva('${doc.id}', 'en proceso')">En proceso</button>
                    <button class="btn btn-danger btn-sm" onclick="actualizarEstadoReserva('${doc.id}', 'rechazado')">Rechazar</button>
                </div>
            `;
            reservasList.appendChild(card);
        }

        // Espera a que el usuario esté autenticado antes de consultar Firestore
        auth.onAuthStateChanged((user) => {
            if (user) {
                db.collection('reservas')
                    .where('proveedorId', '==', user.uid)
                    .where('estado', '==', 'pendiente')
                    .onSnapshot((querySnapshot) => {
                        reservasList.innerHTML = '';
                        if (querySnapshot.empty) {
                            reservasList.innerHTML = '<div>No hay reservas pendientes.</div>';
                        } else {
                            querySnapshot.forEach((doc) => {
                                renderReservaCard(doc);
                            });
                        }
                    }, (error) => {
                        reservasList.innerHTML = '<div>Error obteniendo reservas: ' + error.message + '</div>';
                    });
            } else {
                reservasList.innerHTML = '<div>Por favor, inicia sesión para ver tus reservas pendientes.</div>';
            }
        });
    </script>
</body>
</html>
