<!DOCTYPE html>
<html lang="es">
<head>

    <style>

        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #bbb; border-radius: 4px; }

</head>
<body>

                    <option value="maule">Maule</option>
                    <option value="nuble">Ñuble</option>

                    ],

                const regionSelect = document.getElementById('region');
                const comunaSelect = document.getElementById('comuna');

                regionSelect.addEventListener('change', function() {
                    const region = this.value;
                    comunaSelect.innerHTML = '<option value="">Seleccione una comuna</option>';
                    if (comunasPorRegion[region]) {
                        comunasPorRegion[region].forEach(comuna => {
                            const option = document.createElement('option');
                            option.value = comuna;
                            option.textContent = comuna;
                            comunaSelect.appendChild(option);
                        });
                    }
                });
            </script>
            <div class="form-group">
                <label for="tipo_servicio">Tipo de Servicio</label>
                <select id="tipo_servicio" name="tipo_servicio" required>
                    <option value="">Seleccione un tipo</option>
                    <option value="limpieza">Limpieza</option>
                    <option value="gasfiter">Gasfiter</option>
                </select>
            </div>
            <div class="form-group">
                <label for="servicio">Nombre del Servicio</label>
                <input type="text" id="servicio" name="servicio" required>
            </div>
            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" rows="4" required></textarea>
            </div>
            <div class="form-group">
                <label for="precio">Precio</label>
                <input type="number" id="precio" name="precio" min="0" step="0.01" required>
            </div>
            <button type="submit">Guardar Cambios</button>
        </form>
    </div>
    <script>
        // Configura tu Firebase aquí
        const firebaseConfig = {
            apiKey: "AIzaSyAwjwOh4bjRM3ZtRyV-bGssJ5TCEcRR69c",
            authDomain: "registrousuario-49a1c.firebaseapp.com",
            projectId: "registrousuario-49a1c",
            storageBucket: "registrousuario-49a1c.firebasestorage.app",
            messagingSenderId: "459096702108",
            appId: "1:459096702108:web:7874c1194fb30836ba0159",
            measurementId: "G-FP2WT4DCLJ"
        };
        // Inicializa Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Mapeo de valores de región a su texto con mayúsculas
        const regionTextMap = {
            arica_parinacota: "Arica y Parinacota",
            tarapaca: "Tarapacá",
            antofagasta: "Antofagasta",
            atacama: "Atacama",
            coquimbo: "Coquimbo",
            valparaiso: "Valparaíso",
            metropolitana: "Región Metropolitana de Santiago",
            ohiggins: "Libertador General Bernardo O'Higgins",
            maule: "Maule",
            nuble: "Ñuble",
            biobio: "Biobío",
            araucania: "La Araucanía",
            los_rios: "Los Ríos",
            los_lagos: "Los Lagos",
            aysen: "Aysén del General Carlos Ibáñez del Campo",
            magallanes: "Magallanes y de la Antártica Chilena"
        };

        // Autocompletar input de nombre y cargar datos del servicio si existen
        auth.onAuthStateChanged(async function(user) {
            if (user) {
                let nombreUsuario = user.displayName;
                if (!nombreUsuario) {
                    try {
                        const doc = await db.collection('usuarios').doc(user.uid).get();
                        if (doc.exists && doc.data().nombre) {
                            nombreUsuario = doc.data().nombre;
                        }
                    } catch (e) {
                        // Ignorar error
                    }
                }
                if (nombreUsuario) {
                    const nombreInput = document.getElementById('nombre');
                    if (nombreInput && !nombreInput.value) {
                        nombreInput.value = nombreUsuario;
                    }
                }

                // Cargar datos del servicio si existen
                try {
                    const servicioDoc = await db.collection('servicios').doc(user.uid).get();
                    if (servicioDoc.exists) {
                        const data = servicioDoc.data();
                        // Buscar el value de la región a partir del texto guardado (si corresponde)
                        let regionValue = data.region;
                        // Si el valor guardado es el texto, buscar el value correspondiente
                        if (regionValue && !regionTextMap[regionValue] && Object.values(regionTextMap).includes(regionValue)) {
                            // Buscar la key cuyo valor es igual al texto guardado
                            for (const [key, val] of Object.entries(regionTextMap)) {
                                if (val === regionValue) {
                                    regionValue = key;
                                    break;
                                }
                            }
                        }
                        document.getElementById('region').value = regionValue || '';
                        document.getElementById('region').dispatchEvent(new Event('change'));
                        setTimeout(() => {
                            document.getElementById('comuna').value = data.comuna || '';
                        }, 100);
                        document.getElementById('tipo_servicio').value = data.tipo_servicio || '';
                        document.getElementById('servicio').value = data.servicio || '';
                        document.getElementById('descripcion').value = data.descripcion || '';
                        document.getElementById('precio').value = data.precio !== undefined ? data.precio : '';
                    } else {
                        document.getElementById('region').value = '';
                        document.getElementById('region').dispatchEvent(new Event('change'));
                        setTimeout(() => {
                            document.getElementById('comuna').value = '';
                        }, 100);
                        document.getElementById('tipo_servicio').value = '';
                        document.getElementById('servicio').value = '';
                        document.getElementById('descripcion').value = '';
                        document.getElementById('precio').value = '';
                    }
                } catch (e) {
                    document.getElementById('region').value = '';
                    document.getElementById('region').dispatchEvent(new Event('change'));
                    setTimeout(() => {
                        document.getElementById('comuna').value = '';
                    }, 100);
                    document.getElementById('tipo_servicio').value = '';
                    document.getElementById('servicio').value = '';
                    document.getElementById('descripcion').value = '';
                    document.getElementById('precio').value = '';
                }
            }
        });

        document.getElementById('perfilForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('msg');
            msgDiv.textContent = '';
            msgDiv.className = '';
            const nombre = document.getElementById('nombre').value.trim();
            const regionValue = document.getElementById('region').value;
            const region = regionTextMap[regionValue] || ''; // Guardar el texto con mayúsculas
            const comuna = document.getElementById('comuna').value;
            const tipo_servicio = document.getElementById('tipo_servicio').value;
            const servicio = document.getElementById('servicio').value.trim();
            const descripcion = document.getElementById('descripcion').value.trim();
            const precio = parseFloat(document.getElementById('precio').value);

            if (!nombre || !region || !comuna || !tipo_servicio || !servicio || !descripcion || isNaN(precio)) {
                msgDiv.textContent = 'Por favor, completa todos los campos correctamente.';
                msgDiv.className = 'error';
                return;
            }

            try {
                const user = auth.currentUser;
                if (!user) {
                    msgDiv.textContent = 'Debes iniciar sesión para editar tu perfil.';
                    msgDiv.className = 'error';
                    return;
                }
                await db.collection('servicios').doc(user.uid).set({
                    nombre,
                    region, // Ahora guarda el texto con mayúsculas
                    comuna,
                    tipo_servicio,
                    servicio,
                    descripcion,
                    precio,
                    userId: user.uid,
                    actualizado: firebase.firestore.FieldValue.serverTimestamp()
                });
                msgDiv.textContent = 'Perfil actualizado correctamente.';
                msgDiv.className = 'success';
            } catch (err) {
                msgDiv.textContent = 'Error al guardar: ' + err.message;
                msgDiv.className = 'error';
            }
        });
    </script>
</body>
</html>
