{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión | ServiHogar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f6f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-box {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .navbar-brand img {
      height: 40px;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm py-3">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="/">
      <img src="{% static 'img/logo.png' %}" alt="Logo" class="me-2 rounded-circle" height="40">
      <span class="fw-bold fs-4">ServiHogar</span>
    </a>
  </div>
</nav>

<!-- Login Form -->
<div class="login-container">
  <div class="login-box">
    <h3 class="text-center mb-4">Iniciar Sesión</h3>

    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Ingresar</button>
      </div>
    </form>

    <div id="login-error" class="alert alert-danger mt-3 d-none"></div>

    <p class="mt-3 text-center">
      ¿No tienes una cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a>
    </p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAwjwOh4bjRM3ZtRyV-bGssJ5TCEcRR69c",
    authDomain: "registrousuario-49a1c.firebaseapp.com",
    projectId: "registrousuario-49a1c",
    storageBucket: "registrousuario-49a1c.firebasestorage.app",
    messagingSenderId: "459096702108",
    appId: "1:459096702108:web:7874c1194fb30836ba0159",
    measurementId: "G-FP2WT4DCLJ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById("loginForm");
  const errorDiv = document.getElementById("login-error");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "/dashboard/";
    } catch (error) {
      let message = "Error al iniciar sesión. Verifica tus datos.";
      if (error.code === "auth/user-not-found") {
        message = "Usuario no encontrado.";
      } else if (error.code === "auth/wrong-password") {
        message = "Contraseña incorrecta.";
      }
      errorDiv.textContent = message;
      errorDiv.classList.remove("d-none");
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
